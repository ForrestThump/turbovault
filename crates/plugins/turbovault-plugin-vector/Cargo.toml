[package]
name = "turbovault-plugin-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Semantic vector-search vertical for TurboVault, as a compiled-in plugin module"
readme = "README.md"
keywords = ["mcp", "obsidian", "vault", "plugin", "vector"]
categories = ["development-tools", "text-processing"]

[dependencies]
turbovault-plugin-api = { workspace = true }
turbovault-vector = { workspace = true }
turbomcp-types = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
